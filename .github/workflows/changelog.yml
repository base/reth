name: Changelog

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  changelog:
    # Skip for fork PRs since they can't access secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm install -g @anthropic-ai/claude-code
      - uses: wevm/changelogs/check@b810ec2bdffd21f0d14a4709b4b8ab6f75715246 # master
        with:
          ai: 'claude -p'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
