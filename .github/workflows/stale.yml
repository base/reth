# Marks issues as stale.

name: stale issues

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read

jobs:
  close-issues:
    if: github.repository == 'paradigmxyz/reth'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 21
          days-before-close: 7
          stale-issue-label: "S-stale"
          stale-pr-label: "S-stale"
          exempt-issue-labels: "M-prevent-stale"
          exempt-pr-labels: "M-prevent-stale"
          stale-issue-message: "This issue is stale because it has been open for 21 days with no activity."
          close-issue-message: "This issue was closed because it has been inactive for 7 days since being marked as stale."
          exempt-all-milestones: true
          exempt-all-assignees: true
          repo-token: ${{ secrets.GITHUB_TOKEN }}
